<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Isola – bot nav</title>
    <style>
      :root {
        --bg: #0f1216;
        --panel: #161a20;
        --card: #1d222a;
        --line: #2a313b;
        --text: #e7e9ec;
        --muted: #8c95a3;
        --faint: #5f6875;
        --accent: #f0a860;
        --accent2: #4fd6d0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
      body { font-size: 12.5px; line-height: 1.4; }
      button, input { font: inherit; color: inherit; }
      .num { font-variant-numeric: tabular-nums; }
      #app { display: flex; height: 100%; }
      #mapwrap { flex: 1; position: relative; min-width: 0; background: #0c1a2c; }
      #map { display: block; width: 100%; height: 100%; cursor: crosshair; }
      .hud { position: absolute; background: rgba(14,17,22,0.84); border: 1px solid #ffffff14; border-radius: 8px; padding: 6px 10px; pointer-events: none; }
      #readout { left: 12px; bottom: 12px; min-width: 260px; font-size: 12px; }
      #readout b { color: var(--accent); font-weight: 600; }
      #help { left: 12px; top: 12px; font-size: 11.5px; color: var(--muted); }
      #help kbd { background: #ffffff14; border-radius: 3px; padding: 0 4px; font: 10.5px ui-monospace, monospace; color: var(--text); }
      #progress { left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 14px 18px; }
      #error { position: absolute; left: 16px; right: 16px; top: 16px; display: none; background: #3a1418ee; border: 1px solid #ff6b6b66; color: #ffd6d6; padding: 10px 12px; border-radius: 8px; white-space: pre-wrap; font: 11.5px ui-monospace, monospace; }
      #panel { width: 330px; flex: none; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 14px 30px; }
      h1 { font-size: 17px; margin: 2px 0 2px; }
      .sub { color: var(--muted); margin-bottom: 10px; }
      .row { display: flex; gap: 6px; align-items: center; }
      .row input[type=number] { flex: 1; min-width: 0; background: #0d1014; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
      .btn { background: #262c35; border: 1px solid #333b46; border-radius: 6px; padding: 5px 9px; cursor: pointer; white-space: nowrap; }
      .btn:hover { background: #2f3641; }
      .card { background: var(--card); border: 1px solid #ffffff0b; border-radius: 9px; padding: 9px 11px; margin-top: 10px; }
      .card h2 { font-size: 10.5px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); margin: 0 0 7px; font-weight: 650; }
      .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
      .kv .k { color: var(--muted); }
      .kv .v { text-align: right; font-variant-numeric: tabular-nums; }
      label.chk { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; padding: 1px 0; }
      label.chk input { accent-color: var(--accent); margin: 0; }
      .sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; flex: none; }
      .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; }
      .legend div { display: flex; align-items: center; gap: 6px; }
      .wps { max-height: 180px; overflow-y: auto; font: 11px ui-monospace, monospace; color: var(--muted); }
      .bar { height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--accent2), var(--accent)); min-width: 1px; }
      table.t { width: 100%; border-collapse: collapse; }
      table.t td { padding: 1px 0; }
      table.t td.ms { text-align: right; width: 56px; font-variant-numeric: tabular-nums; }
      table.t td.barc { width: 80px; padding-left: 8px; }
    </style>
  </head>
  <body><script type="module" src="/tools/nav.ts"></script></body>
</html>
