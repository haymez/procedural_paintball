<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Isola – map</title>
    <style>
      :root {
        --bg: #0f1216;
        --panel: #161a20;
        --card: #1d222a;
        --line: #2a313b;
        --text: #e7e9ec;
        --muted: #8c95a3;
        --faint: #5f6875;
        --accent: #f0a860;
        --accent2: #4fd6d0;
        --sea: #123f73;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
      body { font-size: 12.5px; line-height: 1.4; }
      button, input { font: inherit; color: inherit; }
      .num { font-variant-numeric: tabular-nums; }

      /* ---------- single view ---------- */
      #app { display: flex; height: 100%; }
      #mapwrap { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 50%, #17314f 0%, #0c1a2c 75%); min-width: 0; }
      #map { display: block; cursor: grab; box-shadow: 0 0 0 1px #0006, 0 10px 40px #0008; }
      #map.dragging { cursor: grabbing; }
      .hud { position: absolute; background: rgba(14,17,22,0.82); backdrop-filter: blur(6px); border: 1px solid #ffffff14; border-radius: 8px; padding: 6px 10px; pointer-events: none; }
      #readout { left: 12px; bottom: 12px; min-width: 260px; font-size: 12px; }
      #readout b { color: var(--accent); font-weight: 600; }
      #readout .k { color: var(--muted); }
      #zoomctl { right: 12px; top: 12px; display: flex; gap: 4px; padding: 4px; pointer-events: auto; }
      #zoomctl button { width: 28px; height: 26px; border: 0; border-radius: 5px; background: #ffffff10; cursor: pointer; }
      #zoomctl button:hover { background: #ffffff22; }
      #zoomctl .z { min-width: 46px; text-align: center; align-self: center; color: var(--muted); font-size: 11px; }
      #progress { left: 50%; top: 50%; transform: translate(-50%, -50%); width: 300px; padding: 14px 16px; display: none; text-align: center; }
      #progress.on { display: block; }
      #progress .bar, .tile .bar { height: 4px; background: #ffffff18; border-radius: 2px; overflow: hidden; margin-top: 8px; }
      #progress .bar i, .tile .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width 0.12s; }
      #error { position: absolute; left: 16px; right: 16px; top: 16px; display: none; background: #3a1418ee; border: 1px solid #ff6b6b66; color: #ffd6d6; padding: 10px 12px; border-radius: 8px; white-space: pre-wrap; font: 11.5px ui-monospace, monospace; max-height: 50%; overflow: auto; }

      #panel { width: 344px; flex: none; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 14px 30px; }
      #panel::-webkit-scrollbar { width: 8px; }
      #panel::-webkit-scrollbar-thumb { background: #ffffff18; border-radius: 4px; }
      .brand { display: flex; justify-content: space-between; align-items: baseline; color: var(--muted); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
      .brand a { color: var(--accent2); text-decoration: none; letter-spacing: 0.04em; text-transform: none; font-size: 12px; }
      .brand a:hover { text-decoration: underline; }
      h1 { font-size: 19px; margin: 6px 0 2px; font-weight: 700; letter-spacing: -0.01em; }
      .sub { color: var(--muted); margin-bottom: 12px; }
      .seedrow { display: flex; gap: 6px; align-items: center; }
      .seedrow input[type=number] { flex: 1; min-width: 0; background: #0d1014; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 14px; font-variant-numeric: tabular-nums; }
      .seedrow input[type=number]:focus { outline: none; border-color: var(--accent); }
      .btn { background: #262c35; border: 1px solid #333b46; border-radius: 6px; padding: 6px 9px; cursor: pointer; white-space: nowrap; }
      .btn:hover { background: #2f3641; }
      a.btn { color: var(--text); text-decoration: none; }
      .btn.primary { background: var(--accent); color: #231507; border-color: transparent; font-weight: 650; }
      .btn.primary:hover { filter: brightness(1.08); }
      .opts { display: flex; gap: 14px; margin: 8px 0 4px; color: var(--muted); }
      label.chk { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
      label.chk input { accent-color: var(--accent); margin: 0; }
      .card { background: var(--card); border: 1px solid #ffffff0b; border-radius: 9px; padding: 10px 12px; margin-top: 12px; }
      .card h2 { font-size: 10.5px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 650; display: flex; justify-content: space-between; }
      .card h2 span { letter-spacing: 0; text-transform: none; color: var(--faint); font-weight: 500; }
      .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; }
      .kv .k { color: var(--muted); }
      .kv .v { text-align: right; }
      .wind { display: inline-flex; align-items: center; gap: 6px; justify-content: flex-end; }
      .wind svg { width: 16px; height: 16px; }
      table.t { width: 100%; border-collapse: collapse; }
      table.t td { padding: 2px 0; vertical-align: middle; }
      table.t td.ms { text-align: right; width: 64px; }
      table.t td.barc { width: 90px; padding-left: 8px; }
      table.t .bar { height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--accent2), var(--accent)); min-width: 1px; }
      table.t tr.total td { border-top: 1px solid var(--line); padding-top: 5px; font-weight: 650; }
      .layers { display: grid; grid-template-columns: 1fr; gap: 1px; }
      .layer { display: flex; align-items: center; justify-content: space-between; padding: 3px 4px; border-radius: 5px; }
      .layer:hover { background: #ffffff08; }
      .layer .cnt { color: var(--muted); font-size: 11.5px; text-align: right; }
      .detail { color: var(--faint); font-size: 11px; padding: 0 4px 4px 26px; line-height: 1.5; }
      .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; box-shadow: inset 0 0 0 1px #0004; }
      .dia { display: inline-flex; width: 13px; height: 13px; align-items: center; justify-content: center; transform: rotate(45deg); border: 1px solid #0008; flex: none; }
      .dia b { transform: rotate(-45deg); font-size: 7.5px; color: #fff; font-weight: 800; }
      details.props summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; color: var(--muted); padding: 4px; border-radius: 5px; }
      details.props summary::-webkit-details-marker { display: none; }
      details.props summary:hover { background: #ffffff08; }
      details.props summary::before { content: "▸"; margin-right: 6px; transition: transform 0.15s; display: inline-block; }
      details.props[open] summary::before { transform: rotate(90deg); }
      .plist { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 10px; padding: 4px 2px 2px; }
      .plist label { font-size: 11.5px; justify-content: flex-start; }
      .plist .c { margin-left: auto; color: var(--faint); font-size: 10.5px; }
      .plist-actions { display: flex; gap: 6px; padding: 4px 2px 0; }
      .plist-actions .btn { padding: 2px 8px; font-size: 11px; }
      .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
      .legend div { display: flex; align-items: center; gap: 7px; }
      .legend .pct { margin-left: auto; color: var(--faint); font-size: 10.5px; }
      .hint { color: var(--faint); font-size: 11px; margin-top: 12px; line-height: 1.5; }
      kbd { background: #ffffff12; border-radius: 3px; padding: 0 4px; font: 10.5px ui-monospace, monospace; }

      /* ---------- gallery ---------- */
      #gallery { height: 100%; display: flex; flex-direction: column; padding: 12px 16px 14px; gap: 10px; }
      #gallery header { display: flex; align-items: center; gap: 10px; flex: none; }
      #gallery header .title { font-weight: 700; font-size: 15px; margin-right: auto; }
      #gallery header .title span { color: var(--muted); font-weight: 500; margin-left: 8px; }
      #grid { flex: 1; display: grid; grid-template-columns: repeat(3, auto); justify-content: center; align-content: center; gap: 12px; min-height: 0; }
      .tile { background: var(--card); border: 1px solid #ffffff0d; border-radius: 10px; padding: 6px; cursor: pointer; transition: border-color 0.15s, transform 0.15s; position: relative; }
      .tile:hover { border-color: var(--accent); }
      .tile canvas { display: block; border-radius: 6px; background: #0c1a2c; }
      .tile .lbl { display: flex; justify-content: space-between; gap: 8px; padding: 5px 3px 1px; font-size: 11.5px; white-space: nowrap; }
      .tile .lbl .n { font-weight: 650; overflow: hidden; text-overflow: ellipsis; }
      .tile .lbl .n i { color: var(--accent); font-style: normal; margin-right: 6px; }
      .tile .lbl .m { color: var(--muted); }
      .tile .wait { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); color: var(--muted); text-align: center; width: 70%; }
    </style>
  </head>
  <body><script type="module" src="/tools/map.ts"></script></body>
</html>
